<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="title">
  <title id="title">Neural Navigator badge</title>
  <!-- Seal -->
  <circle cx="48" cy="48" r="46" fill="#fbf9f4" stroke="#285239" stroke-width="3"/>
  <circle cx="48" cy="48" r="40.5" fill="none" stroke="#285239" stroke-width="4" stroke-dasharray="1.6 3.7"/>
  <circle cx="48" cy="48" r="35" fill="#e1ebe3" stroke="#151b17" stroke-width="1.5"/>
  <!-- Network: the model's connections -->
  <g stroke="#151b17" stroke-width="1.8" stroke-linecap="round">
    <line x1="48" y1="48" x2="48" y2="24"/>
    <line x1="48" y1="48" x2="27" y2="60"/>
    <line x1="48" y1="48" x2="69" y2="60"/>
    <line x1="48" y1="24" x2="27" y2="60"/>
    <line x1="48" y1="24" x2="69" y2="60"/>
    <line x1="27" y1="60" x2="69" y2="60"/>
  </g>
  <g fill="#fbf9f4" stroke="#151b17" stroke-width="2">
    <circle cx="48" cy="24" r="5"/>
    <circle cx="27" cy="60" r="5"/>
    <circle cx="69" cy="60" r="5"/>
  </g>
  <!-- Compass needle: the navigator -->
  <polygon points="48,33 53,48 48,63 43,48" fill="#151b17"/>
  <polygon points="48,33 53,48 43,48" fill="#f1d75a" stroke="#151b17" stroke-width="1"/>
  <circle cx="48" cy="48" r="2.6" fill="#285239"/>
</svg>
